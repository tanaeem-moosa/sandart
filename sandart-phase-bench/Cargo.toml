[package]
name = "sandart-phase-bench"
version = "0.1.0"
edition = "2024"

# Step 0 of "option 4" (SESSION-HANDOVER-2026-09-13.md §6): unlike sandart-kernel-bench, this
# crate DOES depend on sandart-sim -- the point here is to time the REAL, UNMODIFIED
# `DrawingSimulation::update()` natively and under wasm, not a hand-ported reimplementation, so
# any gap found is real and not an artifact of a second copy of the math drifting from
# `physics.rs`. `phase-timing` is enabled here (and ONLY here / in dev builds -- never in
# sandart-wasm's Cargo.toml) so the section timers in `sandart_sim::phase_timing` are live.
[lib]
name = "sandart_phase_bench"
crate-type = ["cdylib", "rlib"]

[dependencies]
sandart-sim = { path = "../sandart-sim", features = ["phase-timing"] }
glam = "0.29.0"

[[bin]]
name = "native_phase_bench"
path = "src/bin/native_phase_bench.rs"

# This crate is a benchmarking harness, not shipped simulation code -- see
# sandart-kernel-bench/Cargo.toml's identical note on why it does not inherit the workspace
# release-profile tuning by virtue of membership (LTO/codegen-units=1 make symbol-level
# reasoning harder and are not needed for wall-clock section timing).
