[package]
name = "sandart-kernel-bench"
version = "0.1.0"
edition = "2024"

# Native rlib + bin for equivalence/timing on the host; cdylib so the SAME source can also be
# built for wasm32-unknown-unknown (`+simd128`) and driven from node for wasm timing and a SIMD
# instruction count. Deliberately has NO dependency on sandart-sim -- see src/lib.rs's module doc
# comment for why (this crate ports the math by hand instead of linking it).
[lib]
name = "sandart_kernel_bench"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Explicit SIMD library for kernel B. Its `f32x8`/`f32x4` types lower to `core::arch::wasm32`
# v128 ops under wasm32+simd128 and to SSE2/AVX under x86_64 -- see the timing report for what
# was actually confirmed to vectorise.
wide = "1.7.0"

[[bin]]
name = "native_bench"
path = "src/bin/native_bench.rs"

[[bin]]
name = "census_bench"
path = "src/bin/census_bench.rs"

[[bin]]
name = "ftz_daz_bench"
path = "src/bin/ftz_daz_bench.rs"

[[bin]]
name = "copy_variant_bench"
path = "src/bin/copy_variant_bench.rs"

[[bin]]
name = "stage45_breakdown_bench"
path = "src/bin/stage45_breakdown_bench.rs"

[[bin]]
name = "kernel_f_bench"
path = "src/bin/kernel_f_bench.rs"

# This crate is a benchmarking harness, not shipped simulation code: keep it fast to iterate on
# and easy to disassemble (no LTO stripping symbols, no panic=abort swallowing bugs). Does NOT
# inherit the workspace's [profile.release] tuning by virtue of being a workspace member -- that
# profile section applies to every member unless overridden, so this is only here as a marker;
# see the report for whether that mattered.
