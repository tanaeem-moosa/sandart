name: Deploy Web Sandbox

on:
  push:
    branches:
      - main
  # Manual re-run from the Actions tab. Added after three consecutive pushes to main
  # (53516eb, 8da0224, 916ad1d) landed their refs on GitHub but produced no workflow
  # runs and no check-runs at all, leaving the deployed site four commits behind main
  # with no way to kick it. With only `on: push` configured there was no way to
  # redeploy without inventing a commit.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The upstream `curl ... init.sh | sh` installer runs `need_cmd which` and
      # `which rustup`, and ubuntu-latest (now 24.04) no longer ships a `which`
      # binary, so that installer fails at the detection step. This action pulls a
      # prebuilt binary instead, which is both more reliable and much faster.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # `simd128` is NOT on by default for wasm32-unknown-unknown -- without this every float
      # op in the solver ships scalar. Supported by every browser this app targets (Chrome 91+,
      # Firefox 89+, Safari 16.4+).
      #
      # MEASURED: on its own this is worth ~2% (16.57 -> 16.27 ms/tick, best-of-4 interleaved,
      # 512 hourglass water at 120 blocks, run as real wasm under node). LLVM will not
      # auto-vectorise the per-edge solver -- it is branchy and reads ~14 separate cell-keyed
      # arrays 16 bytes at a time. The flag is here because it is a PREREQUISITE for explicit
      # `core::arch::wasm32` intrinsics on a future SoA layout, not because it is a win today.
      # `wasm-opt -O4` was measured too and was NOT better than wasm-pack's default `-O`.
      - name: Compile WebAssembly
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: wasm-pack build sandart-wasm --target web

      - name: Restructure Assets for Deployment
        run: |
          mkdir dist
          cp -r sandart-wasm/web/* dist/
          mkdir dist/pkg
          cp sandart-wasm/pkg/sandart_wasm.js dist/pkg/
          cp sandart-wasm/pkg/sandart_wasm_bg.wasm dist/pkg/
          # Adjust the import path in demo.js to be local
          sed -i 's|../pkg/|./pkg/|g' dist/demo.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
