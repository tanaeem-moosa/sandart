name: Deploy Web Sandbox

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The upstream `curl ... init.sh | sh` installer runs `need_cmd which` and
      # `which rustup`, and ubuntu-latest (now 24.04) no longer ships a `which`
      # binary, so that installer fails at the detection step. This action pulls a
      # prebuilt binary instead, which is both more reliable and much faster.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Compile WebAssembly
        run: wasm-pack build sandart-wasm --target web

      - name: Restructure Assets for Deployment
        run: |
          mkdir dist
          cp -r sandart-wasm/web/* dist/
          mkdir dist/pkg
          cp sandart-wasm/pkg/sandart_wasm.js dist/pkg/
          cp sandart-wasm/pkg/sandart_wasm_bg.wasm dist/pkg/
          # Adjust the import path in demo.js to be local
          sed -i 's|../pkg/|./pkg/|g' dist/demo.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
